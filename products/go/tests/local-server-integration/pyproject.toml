[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ago-local-server-test"
version = "0.1.0"
description = "Local Server integration tests for AirGradient Go"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "zeroconf>=0.132.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
markers = [
  "config_write: changes persisted configuration and restores it",
  "interactive: triggers a physical device action",
  "ota: requires a committed foreground OTA to be active",
]

[tool.setuptools]
py-modules = ["ago_local_api", "conftest"]
